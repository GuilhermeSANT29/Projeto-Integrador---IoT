<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CyberProject — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #050a0f;
      --surface:   #0b1520;
      --border:    #1a3a5c;
      --accent:    #00c8ff;
      --accent2:   #00ff9d;
      --danger:    #ff3b5c;
      --text:      #c8dce8;
      --text-dim:  #4a7a9b;
      --mono:      'Share Tech Mono', monospace;
      --sans:      'Rajdhani', sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--sans);
      color: var(--text);
      overflow: hidden;
      position: relative;
    }

    /* Grid de fundo animado */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,200,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridPan 20s linear infinite;
      pointer-events: none;
    }

    /* Brilho central */
    body::after {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(ellipse, rgba(0,200,255,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    @keyframes gridPan {
      0%   { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }

    /* Scanline overlay */
    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,0.08) 3px,
        rgba(0,0,0,0.08) 4px
      );
      z-index: 999;
    }

    /* Container principal */
    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      padding: 16px;
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Logo / header */
    .logo-area {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border: 2px solid var(--accent);
      border-radius: 12px;
      margin-bottom: 16px;
      position: relative;
      box-shadow: 0 0 20px rgba(0,200,255,0.3), inset 0 0 20px rgba(0,200,255,0.05);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(0,200,255,0.3), inset 0 0 20px rgba(0,200,255,0.05); }
      50%       { box-shadow: 0 0 35px rgba(0,200,255,0.5), inset 0 0 30px rgba(0,200,255,0.1); }
    }

    .logo-icon svg { width: 32px; height: 32px; }

    .logo-title {
      font-family: var(--mono);
      font-size: 22px;
      letter-spacing: 4px;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(0,200,255,0.5);
    }

    .logo-sub {
      font-size: 12px;
      letter-spacing: 3px;
      color: var(--text-dim);
      margin-top: 4px;
      text-transform: uppercase;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      position: relative;
      overflow: hidden;
    }

    /* Linha decorativa no topo */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
    }

    .card-title {
      font-size: 13px;
      font-family: var(--mono);
      letter-spacing: 3px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    /* Alerta de erro */
    .alert {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,59,92,0.1);
      border: 1px solid rgba(255,59,92,0.4);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      color: var(--danger);
      font-family: var(--mono);
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60%  { transform: translateX(-6px); }
      40%,80%  { transform: translateX(6px); }
    }

    /* Grupos de formulário */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 11px;
      font-family: var(--mono);
      letter-spacing: 2px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      transition: color 0.2s;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: rgba(0,200,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 13px 14px 13px 42px;
      font-family: var(--mono);
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      background: rgba(0,200,255,0.06);
      box-shadow: 0 0 0 3px rgba(0,200,255,0.12);
    }

    input:focus + .input-icon,
    .input-wrapper:focus-within .input-icon {
      color: var(--accent);
    }

    /* Botão de submit */
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #006a8a, #00c8ff22);
      border: 1px solid var(--accent);
      border-radius: 8px;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
      margin-top: 8px;
    }

    .btn-submit::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0,200,255,0.15), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #007fa8, #00c8ff33);
      box-shadow: 0 0 24px rgba(0,200,255,0.3);
      transform: translateY(-1px);
    }

    .btn-submit:hover::after { opacity: 1; }
    .btn-submit:active { transform: translateY(0); }

    /* Link para registro */
    .card-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-dim);
      font-family: var(--mono);
    }

    .card-footer a {
      color: var(--accent2);
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .card-footer a:hover { opacity: 0.75; text-decoration: underline; }

    /* Status bar bottom */
    .status-bar {
      margin-top: 20px;
      text-align: center;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .status-dot {
      width: 6px; height: 6px;
      background: var(--accent2);
      border-radius: 50%;
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.2; }
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>

  <div class="login-container">

    <div class="logo-area">
      <div class="logo-icon">
        <!-- Ícone de chip/circuito -->
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="8" y="8" width="16" height="16" rx="2" stroke="#00c8ff" stroke-width="1.5"/>
          <rect x="12" y="12" width="8" height="8" rx="1" fill="rgba(0,200,255,0.15)" stroke="#00c8ff" stroke-width="1"/>
          <line x1="4" y1="11" x2="8" y2="11" stroke="#00c8ff" stroke-width="1.5"/>
          <line x1="4" y1="16" x2="8" y2="16" stroke="#00c8ff" stroke-width="1.5"/>
          <line x1="4" y1="21" x2="8" y2="21" stroke="#00c8ff" stroke-width="1.5"/>
          <line x1="24" y1="11" x2="28" y2="11" stroke="#00c8ff" stroke-width="1.5"/>
          <line x1="24" y1="16" x2="28" y2="16" stroke="#00c8ff" stroke-width="1.5"/>
          <line x1="24" y1="21" x2="28" y2="21" stroke="#00c8ff" stroke-width="1.5"/>
          <line x1="11" y1="4" x2="11" y2="8" stroke="#00ff9d" stroke-width="1.5"/>
          <line x1="16" y1="4" x2="16" y2="8" stroke="#00ff9d" stroke-width="1.5"/>
          <line x1="21" y1="4" x2="21" y2="8" stroke="#00ff9d" stroke-width="1.5"/>
          <line x1="11" y1="24" x2="11" y2="28" stroke="#00ff9d" stroke-width="1.5"/>
          <line x1="16" y1="24" x2="16" y2="28" stroke="#00ff9d" stroke-width="1.5"/>
          <line x1="21" y1="24" x2="21" y2="28" stroke="#00ff9d" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="logo-title">CYBERPROJECT</div>
      <div class="logo-sub">Sistema de Monitoramento Industrial</div>
    </div>

    <div class="card">
      <div class="card-title">// Autenticação de Acesso</div>

      {% if error %}
      <div class="alert">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 3.5a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 018 4.5zm0 8a1 1 0 110-2 1 1 0 010 2z"/>
        </svg>
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="/login" autocomplete="off">
        <div class="form-group">
          <label for="username">Identificador</label>
          <div class="input-wrapper">
            <input
              type="text"
              id="username"
              name="username"
              placeholder="seu_usuario"
              required
              autocomplete="username"
            />
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" color="#4a7a9b">
                <path d="M8 8a3 3 0 100-6 3 3 0 000 6zm0 1c-3.31 0-6 1.79-6 4v.5h12V13c0-2.21-2.69-4-6-4z"/>
              </svg>
            </span>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Senha de Acesso</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            />
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" color="#4a7a9b">
                <path d="M11 5a3 3 0 00-6 0v1H4v7h8V6h-1V5zm-5 0a2 2 0 114 0v1H6V5zm2 5.5a1 1 0 110-2 1 1 0 010 2z"/>
              </svg>
            </span>
          </div>
        </div>

        <button type="submit" class="btn-submit">▶ &nbsp;Acessar Sistema</button>
      </form>

      <div class="card-footer">
        Sem acesso? &nbsp;<a href="/register">Solicitar Cadastro</a>
      </div>
    </div>

    <div class="status-bar">
      <span class="status-dot"></span>
      API ONLINE &nbsp;·&nbsp; ESP8266 CONECTADO &nbsp;·&nbsp; SQL SERVER ATIVO
    </div>

  </div>
</body>
</html>
